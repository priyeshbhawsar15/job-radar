</style></head><body><div class="app" id="app"><aside class="side"><div class="brand"><span class="mark">⌁</span><span class="label">Job Radar</span><button class="collapse" id="collapse" aria-label="Collapse sidebar" title="Collapse sidebar">◀</button></div><nav class="nav" aria-label="Primary"><a href="#/runs"><span class="icon">◷</span><span class="label">Run history</span></a><a href="#/boards"><span class="icon">▦</span><span class="label">Boards</span></a><a href="#/jobs"><span class="icon">⌕</span><span class="label">Extracted jobs</span></a></nav><div class="sidefoot"><b>Operator prototype</b><br>Static sample data only<br>Detailed run records: 7 days</div></aside><main class="main" id="view"></main></div><button class="theme" id="theme" aria-label="Switch to dark theme">◐ Theme</button><script>
const boards=[{id:'oracle',name:'Oracle',adapter:'oracle',url:'https://careers.oracle.com/jobs/',state:'reviewed',rev:'rev-19',runs:18,success:94,missing:[],next:'06:00 IST'},{id:'gururo',name:'Gururo',adapter:'careerpage',url:'https://www.gururo.com/careers',state:'paused',rev:'rev-04',runs:6,success:0,missing:['listing readiness descriptor','reviewed detail route allowlist'],next:'Paused for provider_failure'},{id:'amazon',name:'Amazon',adapter:'amazon_jobs',url:'https://www.amazon.jobs/en/',state:'reviewed',rev:'rev-12',runs:18,success:100,missing:[],next:'06:00 IST'},{id:'celonis',name:'Celonis',adapter:'custom',url:'https://www.celonis.com/careers/',state:'draft',rev:'rev-03',runs:3,success:67,missing:['typed pagination cap','approved readiness descriptor'],next:'Review required'}];
const jobs=[{id:'job-oracle-48129',title:'Senior Software Engineer',company:'Oracle',location:'Bengaluru, India',url:'https://careers.oracle.com/jobs/#en/sites/jobsearch/job/48129',posted:'2026-08-20',type:'Full-time',department:'Cloud Infrastructure',board:'oracle',source:'oracle:48129',revision:'rev-19',discovered:'2026-08-20T18:04:12+05:30',normalization:'accepted · norm-v3',eligibility:'eligible · policy-11',ops:'accepted',receipt:'OPS-48129'},{id:'job-walmart-48131',title:'Backend Engineer II',company:'Walmart',location:'Chennai, India',url:'https://careers.walmart.com/job/backend-engineer-ii',posted:'2026-08-20',type:'Full-time',department:'Engineering',board:'walmart',source:'workday:WMT-19381',revision:'rev-08',discovered:'2026-08-20T18:05:07+05:30',normalization:'accepted · norm-v3',eligibility:'eligible · policy-11',ops:'accepted',receipt:'OPS-48131'},{id:'job-celonis-001',title:'Platform Engineer',company:'Celonis',location:'Bengaluru, India',url:'https://www.celonis.com/careers/jobs/platform-engineer/',posted:'2026-08-20',type:'Full-time',department:'Platform',board:'celonis',source:'celonis:platform-001',revision:'rev-03',discovered:'2026-08-20T18:06:16+05:30',normalization:'accepted · norm-v3',eligibility:'held · duplicate review',ops:'held',receipt:'No delivery intent created'}];
const runs=[{id:'run-240820-1802',time:'20 Aug 2026 · 18:02 IST',state:'partial',duration:'4m 12s',boards:36,completed:35,extracted:28,accepted:19,held:4,boardRuns:[['oracle','completed','9 extracted','br-oracle-1802'],['amazon','completed','4 extracted','br-amazon-1802'],['gururo','partial','provider_failure','br-gururo-1802'],['celonis','held','draft configuration','br-celonis-1802']],jobs:['job-oracle-48129','job-walmart-48131','job-celonis-001']},{id:'run-240820-0601',time:'20 Aug 2026 · 06:01 IST',state:'completed',duration:'3m 41s',boards:36,completed:36,extracted:17,accepted:15,held:0,boardRuns:[['oracle','completed','6 extracted','br-oracle-0601'],['amazon','completed','4 extracted','br-amazon-0601']],jobs:['job-oracle-48129']},{id:'run-240819-1800',time:'19 Aug 2026 · 18:00 IST',state:'failed',duration:'1m 08s',boards:36,completed:0,extracted:0,accepted:0,held:0,boardRuns:[['oracle','failed','capacity_held','br-oracle-1900']],jobs:[]}];
const badge=s=>`<span class="badge ${s}">${s.replaceAll('_',' ')}</span>`; const board=id=>boards.find(x=>x.id===id);const job=id=>jobs.find(x=>x.id===id);const run=id=>runs.find(x=>x.id===id);const link=(h,t,c='')=>`<a class="${c}" href="#${h}">${t}</a>`;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function layout(title,sub,body,actions=''){return `<header class="top"><div><p class="eyebrow">Operator workspace · static prototype</p><h1>${title}</h1><p class="sub">${sub}</p></div><div class="actions">${actions}</div></header>${body}`}
function runsView(){return layout('Pipeline run history','Detailed run data is retained for seven days. Select a run to inspect boards, safe logs, and Job Ops outcomes.',`<div class="notice"><b>Static data.</b> Manual runs, schedules, Playwright, and Job Ops are not connected. Audit entries intentionally contain safe metadata only.</div><section class="metrics"><div class="metric"><span>Retained runs</span><b>18</b><span>7-day window</span></div><div class="metric"><span>Jobs extracted</span><b>246</b><span>normalized records</span></div><div class="metric"><span>Job Ops accepted</span><b>181</b><span>receipt-backed mock status</span></div><div class="metric"><span>Held</span><b>14</b><span>safe review gate</span></div><div class="metric"><span>Next purge</span><b>12</b><span>records in 1d 8h</span></div></section><section class="card"><div class="cardhead"><div><h2>Pipeline runs</h2><p class="mini">Newest first</p></div>${link('/boards','View boards','btn ghost')}</div><div class="stack">${runs.map(r=>link(`/runs/${r.id}`,`<div class="run"><div><b>${r.time}</b><div class="mini">${r.id} · ${r.duration}</div></div><div>${badge(r.state)}</div><div class="stat"><b>${r.extracted}</b>extracted</div><div class="stat"><b>${r.accepted}</b>accepted</div></div>`,'clickcard')).join('')}</div></section>`,link('/boards','Boards','btn ghost')+link('/jobs','Jobs','btn'))}
function pipelineView(r){if(!r)return notFound();return layout('Pipeline run detail',`${r.id} · ${r.time} · ${r.duration}`,`<p class="crumbs">${link('/runs','Run history')} / ${r.id}</p><section class="metrics"><div class="metric"><span>Board outcomes</span><b>${r.completed}/${r.boards}</b><span>completed</span></div><div class="metric"><span>Extracted</span><b>${r.extracted}</b><span>bounded candidates</span></div><div class="metric"><span>Accepted</span><b>${r.accepted}</b><span>Job Ops mock receipts</span></div><div class="metric"><span>Held</span><b>${r.held}</b><span>no dispatch</span></div></section><section class="card"><div class="cardhead"><div><h2>Board runs</h2><p class="mini">Select a board run to inspect its safe audit timeline.</p></div>${badge(r.state)}</div><div class="grid boardcards">${r.boardRuns.map(([id,state,n,br])=>{const b=board(id)||{name:id,adapter:'unknown'};return link(`/board-runs/${br}`,`<p class="eyebrow">${b.adapter}</p><h3>${b.name}</h3><p class="mini">${n}</p><br>${badge(state)}`,'clickcard')}).join('')}</div></section><section class="card" style="margin-top:14px"><div class="cardhead"><h2>Extracted jobs</h2>${link('/jobs','All jobs','btn ghost')}</div><div class="stack">${r.jobs.length?r.jobs.map(id=>{let j=job(id);return link(`/jobs/${id}`,`<b>${esc(j.title)}</b><span class="mini">${esc(j.company)} · ${esc(j.location)} · ${badge(j.ops)}</span>`,'clickcard')}).join(''):'<div class="empty">No job records were extracted for this run.</div>'}</div></section>`,link('/runs','Back','btn ghost'))}
function boardsView(){return layout('Boards','Reviewed board configuration, readiness, missing fields, and observed run health.',`<div class="notice">Board cards are static representative configuration snapshots. An enabled production board requires a reviewed revision and all mandatory controls.</div><div class="grid boardcards">${boards.map(b=>link(`/boards/${b.id}`,`<div class="cardhead"><div><p class="eyebrow">${b.adapter}</p><h2>${b.name}</h2></div>${badge(b.state)}</div><p class="mini">${b.url}</p><div class="grid two" style="margin-top:14px"><span class="stat"><b>${b.runs}</b>observed runs</span><span class="stat"><b>${b.success}%</b>completion</span></div><p class="mini" style="margin-top:12px">${b.missing.length?`${b.missing.length} mandatory field${b.missing.length>1?'s':''} missing`:`Next due: ${b.next}`}</p>`,'clickcard')).join('')}</div>`,link('/runs','Runs','btn ghost'))}
function boardView(b){if(!b)return notFound();return layout(b.name,`${b.adapter} adapter · ${b.rev} · public listing configuration`, `<p class="crumbs">${link('/boards','Boards')} / ${b.name}</p><section class="grid two"><div class="card"><div class="cardhead"><h2>Board configuration</h2>${badge(b.state)}</div><dl class="kv"><dt>Public listing link</dt><dd><a href="${b.url}" target="_blank" rel="noreferrer">${b.url}</a></dd><dt>Adapter family</dt><dd>${b.adapter}</dd><dt>Current revision</dt><dd>${b.rev}</dd><dt>Next admission</dt><dd>${b.next}</dd></dl>${b.missing.length?`<div class="missing" style="margin-top:16px"><b>Mandatory configuration incomplete</b><ul>${b.missing.map(x=>`<li>${x}</li>`).join('')}</ul></div>`:'<div class="notice" style="margin-top:16px">All representative mandatory configuration fields are present. This does not enable a live source.</div>'}</div><div class="card"><h2>Run stats</h2><div class="metrics" style="grid-template-columns:repeat(2,1fr);margin-top:14px"><div class="metric"><span>Retained runs</span><b>${b.runs}</b><span>7 days</span></div><div class="metric"><span>Completion</span><b>${b.success}%</b><span>safe outcomes</span></div><div class="metric"><span>Adapter</span><b>${b.adapter}</b><span>reviewed family</span></div><div class="metric"><span>State</span><b>${b.state}</b><span>no live activation</span></div></div></div></section><section class="card" style="margin-top:14px"><div class="cardhead"><div><h2>Recent board runs</h2><p class="mini">Safe outcomes and audit views.</p></div></div><div class="stack">${runs.flatMap(r=>r.boardRuns.filter(x=>x[0]===b.id).map(([,,n,br])=>link(`/board-runs/${br}`,`<b>${r.time}</b><span class="mini">${n} · ${br}</span>`,'clickcard'))).join('')||'<div class="empty">No retained board runs in this prototype.</div>'}</div></section>`,link(`/boards/${b.id}/config`,'Edit configuration','btn')+link('/boards','Back','btn ghost'))}
function configView(b){if(!b)return notFound();return layout(`Edit ${b.name} configuration`,'Static form only. Saving, review, state transitions, secret values, and source enablement are intentionally unavailable.',`<p class="crumbs">${link('/boards','Boards')} / ${link(`/boards/${b.id}`,b.name)} / configuration</p><section class="grid two"><form class="card form" onsubmit="event.preventDefault();alert('Static prototype: configuration is not saved.');"><div class="notice"><b>Review gate:</b> edits create a draft revision in the real design; an editor cannot self-review or enable it.</div><div class="field"><label>Board ID</label><input value="${b.id}" readonly></div><div class="field"><label>Adapter family</label><select><option>${b.adapter}</option></select></div><div class="field"><label>Public listing URL</label><input value="${b.url}"></div><div class="field"><label>Schedule / timezone</label><input value="Daily · 06:00 Asia/Kolkata"></div><div class="field"><label>Reviewed readiness descriptor</label><input value="${b.missing.includes('reviewed readiness descriptor')?'Missing — required':'ready-listing-v2'}"></div><button class="btn">Save draft (demo)</button></form><div class="card"><h2>Required configuration status</h2><p class="mini">Typed fields are validated server-side in the approved system design.</p><div class="stack" style="margin-top:14px">${['adapter family','public listing link','detail route allowlist','pagination cap','readiness descriptor','resource policy'].map(x=>`<div class="clickcard"><b>${x}</b><br>${b.missing.some(m=>m.includes(x.split(' ')[0]))?badge('draft'):badge('reviewed')}</div>`).join('')}</div></div></section>`,link(`/boards/${b.id}`,'Cancel','btn ghost'))}
function boardRunView(id){let entry;let parent;runs.some(r=>{let x=r.boardRuns.find(q=>q[3]===id);if(x){entry=x;parent=r;return true}});if(!entry)return notFound();let [bid,state,outcome]=entry,b=board(bid)||{name:bid,adapter:'unknown',rev:'unknown'};return layout(`${b.name} board-run log`,`${id} · ${parent.time} · reusable audit detail view`, `<p class="crumbs">${link(`/runs/${parent.id}`,parent.id)} / ${link(`/boards/${bid}`,b.name)} / ${id}</p><section class="grid two"><div class="card"><div class="cardhead"><div><p class="eyebrow">${b.adapter}</p><h2>${outcome}</h2></div>${badge(state)}</div><dl class="kv"><dt>Board revision</dt><dd>${b.rev}</dd><dt>Pipeline run</dt><dd>${parent.id}</dd><dt>Safe outcome</dt><dd>${state} · ${outcome}</dd><dt>Completeness</dt><dd>${state==='partial'?'known false':'known true'}</dd></dl></div><div class="card"><h2>Safe audit boundary</h2><p class="mini">These are the only UI-representable Playwright interaction facts. No raw requests/responses, headers, cookies, internal URLs, screenshots, console text, selectors, or browser exceptions are retained.</p></div></section><section class="card" style="margin-top:14px"><div class="cardhead"><div><h2>Execution timeline</h2><p class="mini">Safe structured events</p></div></div><div class="timeline"><div class="event"><time>18:02:04 IST</time><b>BoardRunRequest issued</b><div class="mini">Capability: cap-demo-${id} · board ${bid} · ${b.rev} · policy revision p-11</div><div class="code">request_kind=BoardRunRequest\nlimits=time_30s pages_3 bytes_5MiB\nreadiness_descriptor=reviewed</div></div><div class="event"><time>18:02:05 IST</time><b>Playwright request admitted</b><div class="mini">Safe response: accepted · diagnostic code browser_request_accepted</div></div><div class="event ${state==='partial'?'warn':state==='failed'?'fail':''}"><time>18:02:31 IST</time><b>Playwright result received</b><div class="mini">Outcome: ${outcome} · duration 26s · candidates ${state==='completed'?9:0} · safe diagnostic ${state==='partial'?'provider_failure':'listing_verified'}</div><div class="code">response_kind=BoardRunResult\noutcome=${outcome}\nduration_ms=26000\nraw_payload=not_retained</div></div><div class="event"><time>18:02:32 IST</time><b>Run finalized</b><div class="mini">Candidate policy and Job Ops eligibility decisions are handled without exposing raw browser material.</div></div></div></section>`,link(`/runs/${parent.id}`,'Pipeline run','btn ghost')+link(`/boards/${bid}`,'Board','btn'))}
function jobsView(){const draw=()=>{let q=(document.querySelector('#jobSearch').value||'').toLowerCase(),o=document.querySelector('#jobDate').value,b=document.querySelector('#jobBoard').value,s=document.querySelector('#jobStatus').value,x=jobs.filter(j=>`${j.title} ${j.company} ${j.location} ${j.board}`.toLowerCase().includes(q)&&(b==='all'||j.board===b)&&(s==='all'||j.ops===s)).sort((a,b)=>(o==='new'?b:a).discovered.localeCompare((o==='new'?a:b).discovered));document.querySelector('#jobList').innerHTML=x.length?x.map(j=>link(`/jobs/${j.id}`,`<div class="row"><span><b>${esc(j.title)}</b><br><span class="mini">${esc(j.company)} · ${j.posted}</span></span>${badge(j.ops)}</div>`,'clickcard')).join(''):'<div class="empty">No jobs match these filters.</div>'};setTimeout(()=>{['jobSearch','jobDate','jobBoard','jobStatus'].forEach(id=>document.querySelector('#'+id).addEventListener(id==='jobSearch'?'input':'change',draw));draw()});return layout('Extracted jobs','Search and filter normalized mock records.',`<section class="card"><div class="grid two"><div class="field"><label>Search jobs<input id="jobSearch" placeholder="Title, company, location"></label></div><div class="field"><label>Sort by date<select id="jobDate"><option value="new">Newest first</option><option value="old">Oldest first</option></select></label></div><div class="field"><label>Board<select id="jobBoard"><option value="all">All boards</option>${boards.map(b=>`<option value="${b.id}">${b.name}</option>`).join('')}</select></label></div><div class="field"><label>Job Ops status<select id="jobStatus"><option value="all">All outcomes</option><option value="accepted">Accepted</option><option value="held">Held</option></select></label></div></div><div id="jobList" class="stack" style="margin-top:14px"></div></section>`,link('/runs','Runs','btn ghost'))}
function jobView(j){if(!j)return notFound();const payload={idempotency_reference:`jr:${j.id}:policy-11`,title:j.title,company:j.company,location:j.location,apply_url:j.url,posting_date:j.posted,employment_type:j.type,department:j.department,board_id:j.board,source_stable_id:j.source,board_revision:j.revision,discovered_at:j.discovered,normalization:j.normalization,eligibility:j.eligibility,job_ops_status:j.ops,job_ops_receipt:j.receipt};return layout(j.title,`${j.company} · normalized job candidate`, `<p class="crumbs">${link('/jobs','Extracted jobs')} / ${j.id}</p><section class="grid two"><div class="card"><div class="cardhead"><h2>Candidate status</h2>${badge(j.ops)}</div><dl class="kv">${Object.entries(payload).filter(([k])=>!['idempotency_reference','job_ops_receipt'].includes(k)).map(([k,v])=>`<dt>${k.replaceAll('_',' ')}</dt><dd>${k==='apply_url'?`<a href="${v}" target="_blank" rel="noreferrer">${esc(v)}</a>`:esc(v)}</dd>`).join('')}</dl></div><div class="card"><h2>Job Ops payload</h2><p class="mini">Complete normalized static mock payload. No credentials, cookies, raw upstream content, or endpoint data is present.</p><pre class="code payload">${esc(JSON.stringify(payload,null,2))}</pre></div></section>`,link('/jobs','Back to jobs','btn ghost'))}
function notFound(){return layout('Not found','This static route does not have representative sample data.',`<div class="empty">Choose ${link('/runs','run history')}, ${link('/boards','boards')}, or ${link('/jobs','extracted jobs')}.</div>`)}
function render(){let p=location.hash.slice(1)||'/runs',a=p.split('/').filter(Boolean),v=document.querySelector('#view');let page=a[0]==='runs'?(a[1]?pipelineView(run(a[1])):runsView()):a[0]==='boards'?(a[1]?(a[2]==='config'?configView(board(a[1])):boardView(board(a[1]))):boardsView()):a[0]==='board-runs'?boardRunView(a[1]):a[0]==='jobs'?(a[1]?jobView(job(a[1])):jobsView()):notFound();v.innerHTML=page;document.querySelectorAll('.nav a[href^="#"]').forEach(x=>x.classList.toggle('active',p.startsWith(x.getAttribute('href').slice(1))));window.scrollTo(0,0)}
const app=document.querySelector('#app'),theme=document.querySelector('#theme');function setTheme(x){document.documentElement.dataset.theme=x;localStorage.setItem('jr-theme',x);theme.setAttribute('aria-label',`Switch to ${x==='dark'?'light':'dark'} theme`)}setTheme(localStorage.getItem('jr-theme')||'light');theme.onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');document.querySelector('#collapse').onclick=()=>{app.classList.toggle('collapsed');localStorage.setItem('jr-sidebar',app.classList.contains('collapsed')?'1':'0')};if(localStorage.getItem('jr-sidebar')==='1')app.classList.add('collapsed');addEventListener('hashchange',render);render();
</script></body></html>
