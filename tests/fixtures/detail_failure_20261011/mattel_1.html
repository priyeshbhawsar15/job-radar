<script type="application/ld+json">{"@context": "http://schema.org", "@type": "JobPosting", "description": "<p><strong>Location:<\/strong> Belagavi, India (Aequs Facility)<br> <strong>Work Arrangement:<\/strong> Onsite 4 days/week<br> <strong>Job Type:<\/strong> Full-Time<br> <strong>Employment:<\/strong> While the day-to-day work location for this role is the Aequs premises in Belagavi, employment will be with Mattel Technology & Innovation Center (MTIC), Hyderabad. MTIC will manage all employee-related processes, including onboarding, payroll, benefits, and other HR-related services.<\/p><p><strong>CREATIVITY IS OUR SUPERPOWER.<\/strong> It’s our heritage and it’s also our future. Because we don’t just make toys. We create innovative products and experiences that inspire fans, entertain audiences and develop children through play. Mattel is at its best when every member of our team feels respected, included, and heard—when everyone can show up as themselves and do their best work every day. We value and share an infinite range of ideas and voices that evolve and broaden our perspectives with a reach that extends into all our brands, partners, and suppliers.<\/p><br/><p><strong>The Opportunity: <\/strong><\/p><p>As the Senior Electronics Engineer, your role is to be technically hands-on and responsible for translating creative toy concepts into manufacturable, high-quality electronic solutions. You will serve as Mattel’s on-the-ground electronics technical representative, ensuring products meet cost, performance, schedule, safety, and quality expectations throughout development, validation, and production ramp. <\/p><p>This position partners closely with internal Electronic Design, Program Management, Mechanical, Quality teams, and external manufacturing partners to bring engaging, safe, and high-quality electronic toys to market across Mattel’s iconic brands. <\/p><p>This role will report to the Associate Manager, Electronic Engineering and will travel in-country of the time to key manufacturing locations and partner sites across India, with occasional international travel as business needs require.<\/p><p><strong>What Your Impact Will Be: <\/strong><\/p><p> <strong>Represent Mattel On-Site and Drive Partner Execution<\/strong> <\/p><ul><li><p>Serve as the primary electronics technical interface to in-country manufacturing, representing Mattel professionally in factory meetings, build events, line reviews, and technical deep dives <\/p><\/li><\/ul><ul><li><p>Communicate Mattel’s design intent, quality standards, safety expectations, and schedule priorities clearly and consistently <\/p><\/li><\/ul><ul><li><p>Lead technical discussions and drive closure on open issues across production stages, corrective actions, and process changes <\/p><\/li><\/ul><p><strong>Bring Electronic Toy Designs to Life Through Manufacturing <\/strong><\/p><ul><li><p>Own electronic manufacturing deliverables for assigned products. <\/p><\/li><\/ul><ul><li><p>Validate final solution against system architecture, schematics, BOM, and functional descriptions. <\/p><\/li><\/ul><ul><li><p>Prototype, validate, and troubleshoot electronic production fixtures. <\/p><\/li><\/ul><ul><li><p>Define and maintain system-level and testing requirements across hardware, firmware, and software interfaces for manufacturing <\/p><\/li><\/ul><p><strong>Ensure Manufacturability, Cost, and Quality Feasibility <\/strong><\/p><ul><li><p>Apply DFM/DFT principles (design for manufacturing / design for test) to ensure robust, repeatable high-volume production <\/p><\/li><\/ul><ul><li><p>Advise component selection considering cost, availability, lifecycle, compliance, and supplier risk <\/p><\/li><\/ul><ul><li><p>Drive value engineering efforts to meet target cost without sacrificing play performance, safety, or reliability <\/p><\/li><\/ul><p><strong>Support Production Readiness and Continuous Improvement <\/strong><\/p><ul><li><p>Support production startup, pilot builds, corrective action implementation, and ongoing product or process improvements  <\/p><\/li><\/ul><ul><li><p>Evaluate and approve pilot/final samples against functional specifications and quality expectations <\/p><\/li><\/ul><ul><li><p>Partner with Quality and Manufacturing teams to improve yields, reduce defects, and prevent recurrence <\/p><\/li><\/ul><p><strong>Collaborate Cross-Functionally and Communicate Clearly <\/strong><\/p><ul><li><p>Collaborate closely with Electronic Design, Program Management, Quality, and other engineering teams <\/p><\/li><\/ul><ul><li><p>Translate technical concepts and trade-offs for both technical and non-technical stakeholders <\/p><\/li><\/ul><ul><li><p>Manage multiple development efforts in parallel while maintaining transparent status, risks, and mitigation plans <\/p><\/li><\/ul><ul><li><p>Clearly and regularly communicate project planning and status to management and the global brand team. <\/p><\/li><\/ul><br/><p><strong>What We’re Looking For: <\/strong><\/p><ul><li>Bachelor’s degree in electrical engineering or related discipline <\/li><li><p>3–6 years of hands-on experience in electronic design, prototyping, and troubleshooting <\/p><\/li><\/ul><ul><li><p>Strong experience with analog and digital circuit design <\/p><\/li><\/ul><ul><li><p>Solid understanding of embedded systems and microcontrollers (8–32 bit; ARM-class or similar) <\/p><\/li><\/ul><ul><li><p>Proficiency in embedded software development using assembly and higher-level programming languages <\/p><\/li><\/ul><ul><li><p>Experience taking products from concept through development and into production in consumer electronics or similarly high-volume products <\/p><\/li><\/ul><ul><li><p>Strong organizational skills with the ability to manage multiple priorities and drive issue closure across partners <\/p><\/li><\/ul><ul><li><p>Strong communication skills and comfort representing the company in meetings with external manufacturers and internal stakeholders <\/p><\/li><\/ul><ul><li><p>Willingness to travel in-country 50–60% annually between manufacturing locations and partner sites <\/p><\/li><\/ul><p><strong>Nice to Haves:<\/strong><\/p><ul><li><p>Experience in toys or highly regulated consumer products <\/p><\/li><\/ul><ul><li><p>Experience with electromechanical, mechatronic, or animatronic systems <\/p><\/li><\/ul><ul><li><p>Exposure to audio engineering, RF, communications, or signal processing <\/p><\/li><\/ul><ul><li><p>Experience with TFT/OLED displays, MEMS sensors, microphones, and wireless ICs (Bluetooth, Wi-Fi, 2.4G) <\/p><\/li><\/ul><ul><li><p>Experience supporting manufacturing builds (pilot/production), test strategy, and factory debug <\/p><\/li><\/ul><ul><li><p>Prior experience working with global vendors and stakeholders (Asia/India/USA). <\/p><\/li><\/ul><br/> <p>Don’t meet every single requirement? At Mattel, we are dedicated to an inclusive workplace and a culture of belonging. If you’re excited about this role but your past experience doesn’t align perfectly with every qualification in the job description, we still encourage you to apply. You may be just the right candidate for this or other roles.<br> <br> <strong>How We Work:<\/strong><br> We are a purpose driven company aiming to empower generations to explore the wonder of childhood and reach their full potential. We live up to our purpose employing the following behaviors:<\/p><ul><li><strong>We collaborate:<\/strong> Being a part of Mattel means being part of one team with shared values and common goals. Every person counts and working closely together always brings better results. Partnership is our process and our collective capabilities is our superpower.<\/li><li><strong>We innovate:<\/strong> At Mattel we always aim to find new and better ways to create innovative products and experiences. No matter where you work in the organization, you can always make a difference and have real impact. We welcome new ideas and value new initiatives that challenge conventional thinking.<\/li><li><strong>We execute:<\/strong> We are a performance-driven company. We strive for excellence and are focused on pursuing best-in-class outcomes. We believe in accountability and ownership and know that our people are at their best when they are empowered to create and deliver results.<\/li><\/ul><p><strong>Our Approach to Flexible Work:<\/strong><br> We embrace a flexible work model designed to empower a culture of growth, optimism, and wellbeing, where every employee can reach their full potential. Combining purposeful in-person collaboration with flexibility, our focus is to optimize performance and drive connection for moments that matter.<\/p><p><strong>Who We Are:<\/strong><br> Mattel is a leading global toy and family entertainment company and owner of one of the most iconic brand portfolios in the world. We engage consumers and fans through our franchise brands, including Barbie, Hot Wheels, Fisher-Price, American Girl, Thomas & Friends, UNO, Masters of the Universe, Matchbox, Monster High, MEGA and Polly Pocket, as well as other popular properties that we own or license in partnership with global entertainment companies. Our offerings include toys, content, consumer products, digital and live experiences. Our products are sold in collaboration with the world’s leading retail and ecommerce companies. Since its founding in 1945, Mattel is proud to be a trusted partner in empowering generations to explore the wonder of childhood and reach their full potential.<\/p><p>Mattel’s award-winning workplace culture has been recognized by Forbes, Fast Company, Newsweek, Great Place to Work, TIME, and more.<\/p><p>Visit us at <a href='https://jobs.mattel.com/' rel='noopener noreferrer'>https://jobs.mattel.com/<\/a> and <a href='http://www.instagram.com/MattelCareers/' rel='noopener noreferrer'>www.instagram.com/MattelCareers<\/a>.<br> <br> Mattel is an Equal Opportunity Employer where we want you to bring your authentic self to work every day. We welcome all job seekers, and all applicants will receive consideration for employment.<\/p><p>Videos to watch:<br> <a href='https://youtu.be/gWyvtJNrMno' rel='noopener noreferrer'>The Culture at Mattel<\/a><br> <a href='https://corporate.mattel.com/philanthropy' rel='noopener noreferrer'>Corporate Philanthropy<\/a><\/p>", "identifier": {"@type": "PropertyValue", "name": "Job ID", "value": "R235778"}, "title": "Sr Electronic Engineer", "url": "https://jobs.mattel.com/en/job/hyderabad/sr-electronic-engineer/2015/90860268592", "jobLocation": [{"@type": "Place", "address": {"@type": "PostalAddress", "addressLocality": "Hyderabad", "addressRegion": "", "addressCountry": "in", "streetAddress": "1804, 18th Floor, Gowra Palladium", "postalCode": "500081"}}], "qualifications": "<p><strong>What We’re Looking For: <\/strong><\/p><ul><li>Bachelor’s degree in electrical engineering or related discipline <\/li><li><p>3–6 years of hands-on experience in electronic design, prototyping, and troubleshooting <\/p><\/li><\/ul><ul><li><p>Strong experience with analog and digital circuit design <\/p><\/li><\/ul><ul><li><p>Solid understanding of embedded systems and microcontrollers (8–32 bit; ARM-class or similar) <\/p><\/li><\/ul><ul><li><p>Proficiency in embedded software development using assembly and higher-level programming languages <\/p><\/li><\/ul><ul><li><p>Experience taking products from concept through development and into production in consumer electronics or similarly high-volume products <\/p><\/li><\/ul><ul><li><p>Strong organizational skills with the ability to manage multiple priorities and drive issue closure across partners <\/p><\/li><\/ul><ul><li><p>Strong communication skills and comfort representing the company in meetings with external manufacturers and internal stakeholders <\/p><\/li><\/ul><ul><li><p>Willingness to travel in-country 50–60% annually between manufacturing locations and partner sites <\/p><\/li><\/ul><p><strong>Nice to Haves:<\/strong><\/p><ul><li><p>Experience in toys or highly regulated consumer products <\/p><\/li><\/ul><ul><li><p>Experience with electromechanical, mechatronic, or animatronic systems <\/p><\/li><\/ul><ul><li><p>Exposure to audio engineering, RF, communications, or signal processing <\/p><\/li><\/ul><ul><li><p>Experience with TFT/OLED displays, MEMS sensors, microphones, and wireless ICs (Bluetooth, Wi-Fi, 2.4G) <\/p><\/li><\/ul><ul><li><p>Experience supporting manufacturing builds (pilot/production), test strategy, and factory debug <\/p><\/li><\/ul><ul><li><p>Prior experience working with global vendors and stakeholders (Asia/India/USA). <\/p><\/li><\/ul>"}</script>
