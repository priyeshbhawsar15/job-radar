<script>window.__staticRouterHydrationData = JSON.parse("{\"loaderData\": {\"jobDetails\": {\"jobsData\": {\"jobNumber\": \"200314015\", \"postingTitle\": \"IN-Genius\", \"jobSummary\": \"Apple Retail is where the best of Apple comes together. We bring our expertise to help people do what they love, delivering an only-at-Apple experience. At Apple, we believe inclusion is a shared responsibility and we work together to foster a culture where everyone belongs and is inspired to do their best work.\\n\\nAs a Genius, you combine extensive functional troubleshooting skills with an ability to inspire excitement for Apple’s products and services. You deliver exceptional service and empower customers to get the most out of their Apple products and services. A Genius makes sure customers are educated about repair options and Apple offerings, and performs repairs on all Apple products serviced in the store. \\n\\nA Genius excels in repairing relationships with customers and demonstrates the high standard of service and support in our retail stores. You enhance team knowledge by modelling exceptional service and educating and mentoring team members.\", \"description\": \"Have extensive knowledge and stay up to date on all Apple products, services and Genius Bar repair processes and procedures to support efficient and high-quality repairs.\\n\\nSupport customers having Apple product or software issues with care and empathy, using all tools and resources provided by Apple. \\n\\nTroubleshoot, diagnose, repair and resolve service concerns for Apple hardware and software. \\n\\nProvide excellent service to Apple customers by seeking to understand their needs, identifying ownership opportunities, presenting product and service recommendations, and educating customers on relevant ways to buy.\\n\\nWork with team leaders to identify recurring repair problems and other service concerns, and make sure that feedback is provided to Apple.\\n\\nUse extensive knowledge of hardware and sof rtners to achieve individual and overall team goals.\\nSupport and educate the broader team by sharing knowledge, experiences and insights.\\nFrequently handle, lift and move merchandise safely.\", \"locations\": [{\"id\": \"postLocation-INDC\", \"name\": \"India\", \"code\": \"INDC\", \"countryName\": \"India\", \"countryID\": \"iso-country-IND\", \"level\": 1, \"active\": true, \"postLocationCountryID\": \"postLocation-INDC\", \"postingIdentifier\": \"2015\", \"showPayAndBenefits\": false, \"promotedOnLinkedIn\": false}], \"managedPipelineRole\": true, \"type\": \"PIPE\"}}}}")</script>
