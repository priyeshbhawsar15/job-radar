<script type="application/ld+json">{"@context": "http://schema.org", "@type": "JobPosting", "description": "<p><strong>CREATIVITY IS OUR SUPERPOWER.<\/strong> It’s our heritage and it’s also our future. Because we don’t just make toys. We create innovative products and experiences that inspire fans, entertain audiences and develop children through play. Mattel is at its best when every member of our team feels respected, included, and heard—when everyone can show up as themselves and do their best work every day. We value and share an infinite range of ideas and voices that evolve and broaden our perspectives with a reach that extends into all our brands, partners, and suppliers.<\/p><p> <\/p><br/><p><strong>BY WMS:<\/strong> <\/p><p>Strong Com skills and Problem Management<\/p><p>Warehouse Mgt + Blue Yonder <\/p><p>Troubleshooting + Problem Solving <\/p><p>Dealing with actual warehouse Management.<\/p><p>Job Title: Senior Developer – Blue Yonder (BY) WMS<br> Location: Hyderabad, India<br> Job Summary: We are seeking an experienced Senior Blue Yonder Warehouse Management System(WMS) Developer who will play a pivotal role in enhancing and maintaining the Blue Yonder Warehouse Management System. This role involves collaborating with cross-functional teams to address the WMS backlog, ensuring optimal system performance, and implementing solutions that align with business objectives. This role requires close collaboration with onshore teams and stakeholders to ensure seamless integration and delivery of technical solutions.  The candidate must be willing to work on site 4 days a week in Hyderabad, during US EST time zone.<br> Key Responsibilities:<br> •    Backlog Management: Analyze, prioritize, and address items in the BY WMS backlog, ensuring timely resolution and alignment with business priorities.<br> •    System Development & Configuration: Design, develop, and implement custom solutions within the BY WMS, utilizing tools like MOCA, Page Builder, and Integrator.<br> •    Integration: Develop and maintain integrations between BY WMS and other enterprise systems such as ERP, TMS, and OMS using APIs and middleware tools.<br> •    Reporting & Labeling: Create and modify reports using Jasper Reports and design labels with tools like NiceLabel or Blue Yonder Label Designer.<br> •    Testing & Deployment: Conduct unit testing, support user acceptance testing (UAT), and oversee deployment of new features and fixes.<br> •    Documentation: Maintain comprehensive documentation for configurations, customizations, and standard operating procedures.<br> •    Support & Troubleshooting: Provide Level 2/3 support for WMS-related issues, ensuring minimal disruption to warehouse operations.<br> •    Continuous Improvement: Stay updated with the latest BY WMS features and best practices, recommending enhancements to improve system efficiency and user experience.<br> •    Quality Assurance: Implement and maintain quality assurance processes to ensure the highest standards of technical delivery.<br> •    Communication: Facilitate effective communication between offshore and onshore teams, ensuring transparency and alignment on project status, risks, and issues.<br> •    Problem Solving: Proactively identify and resolve technical and operational challenges to ensure smooth project execution.<br> •    Stakeholder Management: Build and maintain strong relationships with key stakeholders, providing regular updates and addressing any concerns or requirements.<br>  <\/p><br/><p><strong>What We’re Looking For: <\/strong><\/p><ul><li>Qualifications:<br> •    Education: Bachelor's degree in Computer Science, Information Systems, Supply Chain Management, or a related field.<br> •    Experience: Minimum of 5 years of hands-on experience with Blue Yonder WMS development and configuration.<br> •    Technical Skills: Proficiency in MOCA, Page Builder, and BY Integrator. Strong SQL skills for data analysis and reporting. Experience with API development and integration. Familiarity with reporting tools like Jasper Reports and label design software. Understanding of warehouse operations and related systems<br> •    Problem-Solving: Strong analytical and problem-solving abilities, with a proactive approach to addressing challenges.<br> •    Cultural Awareness: Ability to work effectively in a multicultural environment and manage teams across different time zones.<br> Preferred Qualifications:<br> •    Experience with additional BY modules such as Labor Management or Yard Management.<br> •    Familiarity with Agile development methodologies.<br> •    Knowledge of other WMS platforms or supply chain systems.<br> •    Certifications related to Blue Yonder or supply chain management.<\/li><\/ul><br/> <p>Don’t meet every single requirement? At Mattel, we are dedicated to an inclusive workplace and a culture of belonging. If you’re excited about this role but your past experience doesn’t align perfectly with every qualification in the job description, we still encourage you to apply. You may be just the right candidate for this or other roles.<br> <br> <strong>How We Work:<\/strong><br> We are a purpose driven company aiming to empower generations to explore the wonder of childhood and reach their full potential. We live up to our purpose employing the following behaviors:<\/p><ul><li><strong>We collaborate:<\/strong> Being a part of Mattel means being part of one team with shared values and common goals. Every person counts and working closely together always brings better results. Partnership is our process and our collective capabilities is our superpower.<\/li><li><strong>We innovate:<\/strong> At Mattel we always aim to find new and better ways to create innovative products and experiences. No matter where you work in the organization, you can always make a difference and have real impact. We welcome new ideas and value new initiatives that challenge conventional thinking.<\/li><li><strong>We execute:<\/strong> We are a perf
